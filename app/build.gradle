plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.smsforwarder.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.smsforwarder.app'
        minSdk 26
        targetSdk 37
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
